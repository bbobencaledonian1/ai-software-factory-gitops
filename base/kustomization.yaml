apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-factory-local

resources:
  - workspace-pvc.yaml
  - local-coder-engine-service.yaml
  - local-coder-engine-deployment.yaml
  - tekton-pipeline.yaml

patches:
  - path: patches/local-coder-engine-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: local-coder-engine
