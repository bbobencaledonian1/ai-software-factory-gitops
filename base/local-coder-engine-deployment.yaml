apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-coder-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-coder-engine
  template:
    metadata:
      labels:
        app: local-coder-engine
    spec:
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:latest
          env:
            - name: OLLAMA_MODELS
              value: /tmp/.ollama/models
          ports:
            - containerPort: 11434
