apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-factory-workspace-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-coder-engine
spec:
  template:
    spec:
      containers:
        - name: ollama
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
            limits:
              cpu: "8"
              memory: "32Gi"
