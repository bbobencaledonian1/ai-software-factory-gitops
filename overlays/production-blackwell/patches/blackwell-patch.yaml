apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-factory-workspace-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-coder-engine
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: ollama
          resources:
            limits:
              nvidia.com/gpu: "1"
              cpu: "16"
              memory: "64Gi"
            requests:
              nvidia.com/gpu: "1"
              cpu: "8"
              memory: "32Gi"
