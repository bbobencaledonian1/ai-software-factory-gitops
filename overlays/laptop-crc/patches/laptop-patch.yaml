apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-coder-engine
spec:
  template:
    spec:
      nodeName: crc
      containers:
        - name: ollama
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "6Gi"
